[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphachess"
version = "0.1.0"
description = "Small-scale AlphaZero-style chess: supervised start on Lichess, then MCTS self-play RL"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
data = ["zstandard>=0.22", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["alphachess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (full endgame solves etc.); run with -m slow",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
